# ============================================================
# Production Profile - Dùng biến môi trường từ Railway
# Activate bằng: SPRING_PROFILES_ACTIVE=prod
# ============================================================

spring.application.name=ginfilm-backend

# ---- DATABASE (Railway PostgreSQL) ----
# DATABASE_URL được Railway inject tự động dạng: postgresql://user:pass@host:port/db
# URL được parse bởi DataSourceConfig.java (không cần thêm biến nào khác)
# spring.datasource.url không cần set ở đây

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ---- SERVER ----
# Railway inject PORT env variable
server.port=${PORT:8080}
app.backend.url=${BACKEND_URL:http://localhost:8080}

# ---- COOKIE ----
# Bắt buộc phải true trên HTTPS production để cookie hoạt động trên mobile
app.cookie.secure=true

# ---- JWT ----
jwt.secret=${JWT_SECRET}
# Access token: 1 ngay (86400000 ms)
jwt.expiration=${JWT_EXPIRATION:86400000}
# Refresh token: 7 ngay (604800000 ms)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ---- CORS ----
# Frontend production URL
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ---- EMAIL ----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
app.contact.email=${CONTACT_EMAIL:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
brevo.api.key=${BREVO_API_KEY:}

# ---- FILE UPLOAD ----
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ---- ENCRYPTION ----
chat.encryption.key=${CHAT_ENCRYPTION_KEY}

# ---- VNPAY (Sandbox) ----
vnpay.tmnCode=${VNPAY_TMN_CODE:}
vnpay.hashSecret=${VNPAY_HASH_SECRET:}
vnpay.url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
# returnUrl trỏ về production domain
vnpay.returnUrl=${VNPAY_RETURN_URL:${app.frontend.url}/payment-success}
vnpay.apiUrl=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

# ---- STRIPE (Test mode) ----
stripe.api.key=${STRIPE_SECRET_KEY:}

# ---- LOGGING ----
logging.level.root=WARN
logging.level.com.Cinema=INFO

# ---- CLOUDINARY ----
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dkajdguj}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# S3 media — DB lưu key; poster qua /api/media/border; trailer qua /api/media/stream (công khai); phim movie/ qua /api/media/stream + token vé
app.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:https://java-06.s3.ap-southeast-1.amazonaws.com}
app.s3.bucket=${AWS_S3_BUCKET:java-06}
app.s3.region=${AWS_REGION:ap-southeast-1}
app.s3.access-key-id=${AWS_ACCESS_KEY_ID:}
app.s3.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
# Upload admin bật khi có AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (AwsS3Config)
app.s3.presign-ttl-seconds=${AWS_S3_PRESIGN_TTL:3600}
app.s3.multipart-part-size-bytes=${AWS_S3_MULTIPART_PART_SIZE:16777216}

# Optional AI spoiler checker.
gemini.api.key=${GEMINI_API_KEY:}

stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}

# Optional Google login; must match the frontend client ID.
google.client-id=${GOOGLE_CLIENT_ID:}
